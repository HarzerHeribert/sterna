name: CI (extended)

# Deliberately LARGE, and deliberately not the gate.
#
# scripts/ci-local.sh is the blocking gate and stays that way: it is faster on
# the developer's machine than any hosted runner, and it is what every worker
# runs before reporting. This workflow is the trailing sweep with a matrix one
# laptop cannot host -- more operating systems, more architectures and more
# compilers. Wall-clock is not a constraint here; the green tick is.
#
# COST, and why the trigger below is still manual: GitHub-hosted standard
# runners are free for PUBLIC repositories and metered for private ones, with
# macOS billed at 10x. This matrix is roughly a dozen jobs. The repository was
# made public on 2026-09-05 and these triggers were enabled in the same change;
# if it is ever made private again, drop `push` and `pull_request` in that
# same commit or a single push will spend most of a month's included minutes.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Sterna and the inference gateway on every OS and architecture GitHub hosts,
  # on the declared compiler; the gateway alone on its MSRV floor (Sterna's
  # floor is its own, 1.96, set by `oxc`, and the declared compiler is above
  # it). Beta and nightly ride along on one OS as early warning, allowed to
  # fail.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.toolchain == 'beta' || matrix.toolchain == 'nightly' }}
    # Compile cache backed by the Actions cache service; sccache stores
    # per-crate outputs and survives the 10 GB per-repository cache cap a
    # whole target/ would blow through. Scoped to this job: a job that never
    # installs sccache must not have RUSTC_WRAPPER set.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # x86_64 Linux
          - ubuntu-24.04-arm     # aarch64 Linux
          - macos-latest         # aarch64 macOS (the development machine's shape)
          - windows-latest       # x86_64 Windows -- what most users have
          - windows-11-arm       # aarch64 Windows -- what the local VM tests
        toolchain: [declared, msrv]
        include:
          - { os: ubuntu-latest, toolchain: beta }
          - { os: ubuntu-latest, toolchain: nightly }
    steps:
      # The ruler cuts a worktree at a task's PARENT commit
      # (crates/sterna/src/ruler/attempt.rs), and its tests do the same at
      # HEAD^; a depth-1 checkout has no parent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both versions are declared once, in Cargo.toml, and read from there
      # the same way scripts/ci-local.sh reads them -- the two cannot drift.
      # The MSRV cell tests the crate that declares the workspace floor.
      - name: Resolve the toolchain and packages for this cell
        id: tc
        shell: bash
        run: |
          case "${{ matrix.toolchain }}" in
            declared) v="$(grep -m1 '^toolchain' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" ;;
            msrv)     v="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" ;;
            *)        v="${{ matrix.toolchain }}" ;;
          esac
          test -n "$v"
          if [ "${{ matrix.toolchain }}" = msrv ]; then pkgs="-p inference-gateway"; else pkgs="--workspace"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "toolchain for this cell: $v, packages: $pkgs"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.version }}
          components: clippy, rustfmt

      - name: Compile cache
        uses: mozilla-actions/sccache-action@v0.0.9

      # The gateway's Linux Secret Service backend links libdbus through
      # `libdbus-sys`, whose build script needs the dev headers and pkg-config.
      # gnome-keyring and libsecret-tools are the CI fixture's provider and its
      # proof CLI; dbus is dbus-run-session, which the fixture uses for a
      # private bus.
      - name: Linux build-host packages (libdbus for the Secret Service backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config dbus gnome-keyring libsecret-tools

      - name: Build
        run: cargo build --locked ${{ steps.tc.outputs.packages }} --all-targets

      # --no-fail-fast: this is the sweep, not the gate -- one red must not
      # hide the others. The Test steps continue-on-error on purpose, and the
      # log they tee is judged by the "Re-run failures alone" step at the END
      # of the job: a red test must not stop the doctests, clippy and rustdoc
      # behind it (user, 2026-09-11), and a failed test gets one rerun alone
      # before it counts. Linux runs under a real, unlocked Secret Service, the
      # fixture ci-local.sh's run_linux() sources.
      - name: Test (Linux, under the Secret Service fixture)
        id: test_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          . scripts/lib/secret-service-fixture.sh
          secret_service_fixture_run cargo test --locked ${{ steps.tc.outputs.packages }} --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Test
        id: test
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked ${{ steps.tc.outputs.packages }} --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Doctests
        run: cargo test --locked ${{ steps.tc.outputs.packages }} --doc

      - name: Clippy
        if: matrix.toolchain == 'declared'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The gateway only: sterna's docs were never held to -D warnings and
      # link private items in several places.
      - name: Rustdoc
        if: matrix.toolchain == 'declared'
        run: cargo doc -p inference-gateway --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Re-run failures alone, once
        if: always() && (steps.test.outcome == 'failure' || steps.test_linux.outcome == 'failure')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf '%s\n' '#!/usr/bin/env bash' '. scripts/lib/secret-service-fixture.sh' 'secret_service_fixture_run "$@"' > "$RUNNER_TEMP/with-fixture.sh"
            chmod +x "$RUNNER_TEMP/with-fixture.sh"
            bash scripts/ci/rerun-failed-alone.sh "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/with-fixture.sh"
          else
            bash scripts/ci/rerun-failed-alone.sh "$RUNNER_TEMP/test.log"
          fi

      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  # The checks that never cost a compiler: formatting, the file-size ratchet,
  # the secret scan and the scripts' own tests.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the declared toolchain
        id: tc
        shell: bash
        run: |
          v="$(grep -m1 '^toolchain' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"; test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.version }}
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: File-size ratchet
        run: python3 scripts/check-file-sizes.py
      - name: Secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            python3 scripts/check-secrets.py --range "$BEFORE_SHA..$HEAD_SHA"
          else
            python3 scripts/check-secrets.py --tree
          fi
      # Some script tests write fixtures under .agent-runtime/, which is
      # gitignored and exists only in a developer's main checkout.
      - name: Script tests
        run: |
          mkdir -p .agent-runtime
          for t in scripts/tests/test_*.py; do python3 "$t" || exit 1; done

  # Known-vulnerable dependencies, from the RustSec advisory database. Free
  # to run, and the only check in this file that can go red with no change
  # to the tree at all -- which is the point.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action posts a check run when it has something to say; without
    # checks: write it fails on that POST rather than on the advisory
    # (sweep 34009634577, 2026-09-06: "Resource not accessible by
    # integration" after one unmaintained-crate warning).
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2024-0436: `paste` is unmaintained; it reaches this tree
          # only through sterna's V8 crate (rusty_v8), whose maintainers own
          # the replacement. Re-read when rusty_v8 moves.
          ignore: RUSTSEC-2024-0436

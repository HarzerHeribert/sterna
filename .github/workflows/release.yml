name: Release

# Builds sterna and inference-gateway in release profile for the five OS/arch targets
# ci-extended.yml already exercises, and publishes them as a GitHub
# pre-release with a SHA256SUMS file. This workflow never publishes to any
# package registry: a tagged pre-release (built binaries only) is cut from
# main once the sterna Windows cell is green.
#
# A `v*` tag is the real trigger; workflow_dispatch exists to dry-run the
# build (default) without publishing anything, so the pipeline can be proven
# before the first real tag uses it.

on:
  push:
    tags:
      - "v*"
  # The broker-bump workflow cuts a release by calling this one: a tag pushed
  # with the workflow's own token starts no other workflow.
  workflow_call:
    inputs:
      tag:
        description: "The tag to build and publish"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload artifacts without publishing a release"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One matrix job per target, mirroring ci-extended.yml's five OS/arch cells.
  # Every target here is the native default for its runner (no cross
  # compilation), so `--target` only fixes the output path and the archive
  # name -- it does not require `rustup target add`.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Both versions are declared once, in Cargo.toml -- the same read
      # ci-extended.yml and scripts/ci-local.sh use, so none of the three can
      # drift from each other.
      # The Linux Secret Service backend links libdbus through libdbus-sys,
      # whose build script needs the dev headers and pkg-config on the build
      # host -- the same step ci-extended.yml runs; the first dry run
      # (34011510206, 2026-09-06) failed both Linux builds without it.
      - name: Linux build-host packages (libdbus for the Secret Service backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config

      - name: Resolve the declared toolchain
        id: tc
        shell: bash
        run: |
          v="$(grep -m1 '^toolchain' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, pinned 2026-09-06
        with:
          toolchain: ${{ steps.tc.outputs.version }}

      # A tag push names the version; workflow_dispatch (always a dry run)
      # cannot, so it gets a fixed placeholder version instead.
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            v="${{ inputs.tag }}"
            v="${v#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.1.0-dry"
          fi
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # STERNA_RELEASE is the version `sterna --version` and the host report,
      # so an engine says which release it is.
      - name: Build
        env:
          STERNA_RELEASE: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p sterna -p inference-gateway

      # Proves the binary that will ship actually runs before it is packaged:
      # `--help` prints the usage and exits 0. Closed stdin makes sure a
      # binary that reads input instead returns at once rather than hangs.
      - name: Verify binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release"
          "$BIN/inference-gateway" --version
          "$BIN/sterna" --help < /dev/null
      - name: Verify binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          & "$bin/inference-gateway.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "" | & "$bin/sterna.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="sterna-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          STAGE="$RUNNER_TEMP/$NAME"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$STAGE"
          cp "$BIN/sterna" "$BIN/inference-gateway" "$STAGE/"
          cp README.md release/cliproxyapi.toml "$STAGE/"
          cp LICENSE* "$STAGE/" 2>/dev/null || true
          tar czf "$NAME.tar.gz" -C "$RUNNER_TEMP" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sterna-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$bin/sterna.exe" $stage
          Copy-Item "$bin/inference-gateway.exe" $stage
          Copy-Item README.md $stage
          Copy-Item release/cliproxyapi.toml $stage
          Get-ChildItem -Path . -Filter "LICENSE*" -File | ForEach-Object { Copy-Item $_.FullName $stage }
          # The folder itself, so the zip opens to one top folder named like the
          # archive -- the shape the tarball has and the updater looks for.
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline:$false "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sterna-${{ matrix.target }}
          path: |
            sterna-*.tar.gz
            sterna-*.tar.gz.sha256
            sterna-*.zip
            sterna-*.zip.sha256
          if-no-files-found: error

  # The desktop app for the same tag, built by desktop.yml and published
  # with the terminal's archives. No secrets are passed on: the app is
  # unsigned until signing is set up for releases.
  desktop:
    name: desktop
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS

      # Real publish only for a tag push that was not a dry run. `inputs` is
      # empty for a `push` event, so `inputs.dry_run != true` is true there --
      # a tag always publishes unless the ref check below fails. A
      # workflow_dispatch run publishes only if someone explicitly set
      # dry_run to false, and even then only on a tag ref.
      - name: Publish pre-release
        if: (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && inputs.dry_run != true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.msi
            dist/*-setup.exe
            dist/SHA256SUMS

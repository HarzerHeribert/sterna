name: Broker bump

# Daily: when CLIProxyAPI (the subscription broker the gateway runs) has a
# new release, pin it in release/cliproxyapi.toml with upstream's own
# checksums, commit that to main, tag the next pre-release and build it --
# so `sterna update` and the installer pick up the new broker, and with it the
# models it knows. The pin commit is the review trail: every shipped broker
# is named, with its SHA-256, in this repository's history.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: broker-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Pin the latest CLIProxyAPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Pin the latest release
        id: pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release/bump-broker.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- release/cliproxyapi.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, tag and push
        id: release
        if: steps.pin.outputs.changed == 'true'
        run: |
          set -euo pipefail
          last="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          tag="$(python3 scripts/release/next-tag.py "$last")"
          git config user.name "sterna-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: CLIProxyAPI ${{ steps.pin.outputs.version }}" -- release/cliproxyapi.toml
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: bump
    if: needs.bump.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}

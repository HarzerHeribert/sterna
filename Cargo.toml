[workspace]
resolver = "3"
members = ["crates/inference-gateway", "crates/pane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# All rights reserved -- see LICENSE. `license-file` rather than an SPDX
# `license` expression because no SPDX identifier describes "published for
# reading, nothing granted", and a permissive identifier here would BE the
# grant: cargo metadata is where downstream tooling looks for permission.
# `publish = false` is the enforcing half, so no `cargo publish` can put a
# crate on crates.io -- which requires an open licence -- by accident.
license-file = "LICENSE"
publish = false
repository = "https://github.com/HarzerHeribert/glasshouse"

# The compiler both gates build with. Declared once; ci.yml and
# scripts/ci-local.sh read it with the same grep as `rust-version`, so the
# GitHub `stable` channel and the local `rust:latest` image — two distribution
# paths with different lag — can no longer drift onto different compilers, and
# an image bump can no longer silently invalidate the local Linux build cache.
# Bump it deliberately, in one commit, like the MSRV.
[workspace.metadata.ci]
toolchain = "1.98.0"

# Warnings are denied HERE, not through RUSTFLAGS, and the difference is worth
# a paragraph because it was costing hours a day.
#
# RUSTFLAGS is part of cargo's fingerprint, and it applies to every unit in the
# build including dependencies. The gate used to carry `-D warnings` on the
# build and test steps, an explicitly empty `RUSTFLAGS=` on the clippy step
# (mirroring ci.yml, which sets it on neither), and nothing at all on a
# developer's interactive `cargo build`. Three values, one target/, each one
# invalidating what the last had produced. On 2026-09-04 that tree held 1203
# fingerprint entries for `glasshouse` and 24 for `thiserror` -- a dependency
# that should have one -- and 60G of coexisting rebuilds of the same code.
# Every gate run was recompiling the world two or three times to answer one
# question.
#
# `[lints]` is not a compiler flag: cargo applies it per workspace member, the
# same way for every invocation, so interactive builds, the clippy step, the
# test step and CI all land in ONE fingerprint namespace. It also stops at the
# workspace boundary, so a dependency emitting a warning after `cargo update`
# is no longer a build failure in someone else's code -- which is what
# `-D warnings` in RUSTFLAGS actually meant, and never what the gate wanted.
[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
getrandom = "0.4"
hex = "0.4"
# The OS credential store, pinned to the 3.6 minor line. This pin was
# originally justified by the MSRV — 4.x declares `rust-version = "1.88.0"`
# and the workspace claimed 1.85. **That justification is void**: the `msrv`
# CI job proved on its first run that `ratatui` and `time` already required
# 1.88, so the floor was 1.88 all along and the manifest was simply wrong.
# The pin stays for a different and smaller reason — the macOS Keychain path
# is verified against 3.6.3, and moving to 4.x is a re-verification exercise
# with its own evidence, not a free `cargo update`. 3.6.3 declares
# `rust-version = "1.75"`, comfortably inside.
#
# `default-features = false` and no platform feature *here* on purpose: with
# no backend feature enabled, keyring 3.x resolves `keyring::default` to its
# **mock** store, which accepts and returns credentials in-process and
# persists nothing. That is precisely the silent degradation Phase 9E line 2
# forbids, so the backend feature is enabled per target instead — see
# `crates/inference-gateway/Cargo.toml`, where only macOS turns on `apple-native`.
keyring = { version = "3.6", default-features = false }
# The Linux half of the same boundary, and a **different crate on purpose**.
# `keyring` 3.6's Secret Service backend reaches the bus through
# `SecretService::connect`, which leaves `dbus-secret-service`'s prompt timeout
# unset and blocks the calling thread for a year on an unanswered unlock
# prompt; it also unlocks a locked collection on the way to reading it. Talking
# to `dbus-secret-service` directly is what makes
# `connect_with_max_prompt_timeout(_, 0)` reachable, and that is the Linux
# equivalent of `SecKeychainSetUserInteractionAllowed(0)` — see
# `crates/inference-gateway/src/secret/native.rs`.
#
# `default-features = false` with `crypto-rust`: the crypto feature is what
# makes `EncryptionType::Dh` exist at all, so a session that would send a
# credential over the bus in the clear does not compile. `crypto-rust` rather
# than `crypto-openssl` because it is pure Rust and adds no second C library
# to a build that already needs `libdbus-1-dev`.
dbus-secret-service = { version = "4.1", default-features = false, features = ["crypto-rust"] }
ratatui = "0.30"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
# Format-preserving TOML, for `glasshouse migrate-gateway-state` alone: the
# rewrite it performs must keep the user's comments and layout, which
# `toml`'s value model cannot. MSRV 1.85, inside this workspace's 1.88.
toml_edit = "0.25"
# Blocking HTTP with rustls, and a response body that is a `Read` — the two
# properties that let the gateway stream a response through without an async
# runtime. `default-features = false` drops `gzip`: transparent decompression
# would rewrite a body the gateway promises to pass through untouched.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
which = "8"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
tempfile = "3"

[profile.release]
strip = true
